<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="720" viewBox="0 0 1365 720" role="img" aria-labelledby="title desc">
  <title id="title">脱敏演示核查矩阵</title>
  <desc id="desc">合成数据生成的三个桩号工序完整性初筛结果。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f4e78" flood-opacity="0.13"/></filter>
    <style>
      .sans { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .th { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .td { font-size: 13px; fill: #24364b; text-anchor: middle; }
      .ok { font-size: 17px; font-weight: 800; fill: #375623; text-anchor: middle; }
      .miss { font-size: 17px; font-weight: 800; fill: #c00000; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1365" height="720" fill="#f4f7fb"/>
  <rect x="42" y="42" width="1281" height="636" rx="22" fill="#fff" stroke="#dce6ef" filter="url(#shadow)"/>
  <path d="M64 42h1237a22 22 0 0 1 22 22v80H42V64a22 22 0 0 1 22-22z" fill="#1f4e78"/>
  <text x="72" y="102" class="sans" font-size="30" font-weight="700" fill="#fff">脱敏演示：桩基工序照片完整性初筛矩阵</text>
  <text x="1290" y="102" class="sans" font-size="14" fill="#d9e8f5" text-anchor="end">所有桩号与图片均为合成数据</text>

  <g class="sans">
    <rect x="68" y="166" width="150" height="44" rx="11" fill="#fff" stroke="#c6d9ea"/><text x="88" y="194" font-size="19" font-weight="700" fill="#1f4e78">22</text><text x="119" y="194" font-size="14" fill="#53657a">扫描照片</text>
    <rect x="230" y="166" width="150" height="44" rx="11" fill="#fff" stroke="#c6d9ea"/><text x="250" y="194" font-size="19" font-weight="700" fill="#1f4e78">21</text><text x="281" y="194" font-size="14" fill="#53657a">成功解析</text>
    <rect x="392" y="166" width="150" height="44" rx="11" fill="#fff" stroke="#c6d9ea"/><text x="412" y="194" font-size="19" font-weight="700" fill="#1f4e78">3</text><text x="438" y="194" font-size="14" fill="#53657a">桩号分组</text>
    <rect x="554" y="166" width="150" height="44" rx="11" fill="#fff" stroke="#c6d9ea"/><text x="574" y="194" font-size="19" font-weight="700" fill="#1f4e78">1</text><text x="600" y="194" font-size="14" fill="#53657a">命名异常</text>
  </g>

  <g transform="translate(68 238)" class="sans">
    <rect width="1229" height="216" rx="12" fill="#fff" stroke="#d8e1ea"/>
    <path d="M12 0h1205a12 12 0 0 1 12 12v48H0V12A12 12 0 0 1 12 0z" fill="#5b9bd5"/>
    <g class="th">
      <text x="62" y="35">桩号分组</text><text x="178" y="35">包含桩号</text><text x="295" y="35">对中</text><text x="377" y="35">焊接</text><text x="476" y="29">钢筋笼</text><text x="476" y="45">验收</text><text x="570" y="35">初灌</text><text x="650" y="35">二清</text><text x="730" y="35">入岩</text><text x="810" y="35">终孔</text><text x="890" y="35">其它</text><text x="1073" y="35">待核查项</text>
    </g>
    <rect y="112" width="1229" height="52" fill="#f8fafc"/>
    <path d="M0 60h1229M0 112h1229M0 164h1229" stroke="#e0e7ee"/>
    <g class="td">
      <text x="62" y="93">P001</text><text x="178" y="93">P001</text><text x="1073" y="93">无</text>
      <text x="62" y="145">P002</text><text x="178" y="145">P002</text><text x="1073" y="145">入岩</text>
      <text x="62" y="197">P003</text><text x="178" y="197">P003, P003D900</text><text x="1073" y="197">无</text>
    </g>
    <g>
      <g fill="#e2f0d9"><rect x="281" y="73" width="28" height="28" rx="8"/><rect x="363" y="73" width="28" height="28" rx="8"/><rect x="462" y="73" width="28" height="28" rx="8"/><rect x="556" y="73" width="28" height="28" rx="8"/><rect x="636" y="73" width="28" height="28" rx="8"/><rect x="716" y="73" width="28" height="28" rx="8"/><rect x="796" y="73" width="28" height="28" rx="8"/></g>
      <g class="ok"><text x="295" y="94">✓</text><text x="377" y="94">✓</text><text x="476" y="94">✓</text><text x="570" y="94">✓</text><text x="650" y="94">✓</text><text x="730" y="94">✓</text><text x="810" y="94">✓</text></g>
      <rect x="876" y="73" width="28" height="28" rx="8" fill="#fce4d6"/><text x="890" y="94" class="miss">✗</text>

      <g fill="#e2f0d9"><rect x="281" y="125" width="28" height="28" rx="8"/><rect x="363" y="125" width="28" height="28" rx="8"/><rect x="462" y="125" width="28" height="28" rx="8"/><rect x="556" y="125" width="28" height="28" rx="8"/><rect x="636" y="125" width="28" height="28" rx="8"/><rect x="796" y="125" width="28" height="28" rx="8"/><rect x="876" y="125" width="28" height="28" rx="8"/></g>
      <g class="ok"><text x="295" y="146">✓</text><text x="377" y="146">✓</text><text x="476" y="146">✓</text><text x="570" y="146">✓</text><text x="650" y="146">✓</text><text x="810" y="146">✓</text><text x="890" y="146">✓</text></g>
      <rect x="716" y="125" width="28" height="28" rx="8" fill="#fce4d6"/><text x="730" y="146" class="miss">✗</text>

      <g fill="#e2f0d9"><rect x="281" y="177" width="28" height="28" rx="8"/><rect x="363" y="177" width="28" height="28" rx="8"/><rect x="462" y="177" width="28" height="28" rx="8"/><rect x="556" y="177" width="28" height="28" rx="8"/><rect x="636" y="177" width="28" height="28" rx="8"/><rect x="716" y="177" width="28" height="28" rx="8"/><rect x="796" y="177" width="28" height="28" rx="8"/></g>
      <g class="ok"><text x="295" y="198">✓</text><text x="377" y="198">✓</text><text x="476" y="198">✓</text><text x="570" y="198">✓</text><text x="650" y="198">✓</text><text x="730" y="198">✓</text><text x="810" y="198">✓</text></g>
      <rect x="876" y="177" width="28" height="28" rx="8" fill="#fce4d6"/><text x="890" y="198" class="miss">✗</text>
    </g>
  </g>

  <g class="sans" font-size="13" fill="#596d80">
    <rect x="70" y="484" width="27" height="27" rx="8" fill="#e2f0d9"/><text x="83.5" y="504" class="ok">✓</text><text x="109" y="503">检索到符合规则的照片</text>
    <rect x="330" y="484" width="27" height="27" rx="8" fill="#fce4d6"/><text x="343.5" y="504" class="miss">✗</text><text x="369" y="503">未检索到，需要人工复核</text>
  </g>
  <rect x="68" y="540" width="1229" height="68" rx="10" fill="#fff7ec"/><rect x="68" y="540" width="5" height="68" rx="2.5" fill="#ef9b43"/>
  <text x="91" y="581" class="sans" font-size="15" fill="#74512b">输出只反映文件名层面的照片收集情况；“✗”不等于工序未施工，也不等于验收不合格。</text>
</svg>
