<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="720" viewBox="0 0 1365 720" role="img" aria-labelledby="title desc">
  <title id="title">桩基工序照片完整性初筛工具概览</title>
  <desc id="desc">展示项目的真实业务规模、核心流程和功能边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fb"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf5f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f4e78" flood-opacity="0.13"/>
    </filter>
    <style>
      .sans { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .h1 { font-size: 38px; font-weight: 700; fill: #14213d; }
      .sub { font-size: 19px; fill: #53657a; }
      .badge { font-size: 14px; font-weight: 700; fill: #1f4e78; }
      .metric { font-size: 28px; font-weight: 700; fill: #1f4e78; }
      .caption { font-size: 15px; fill: #687b90; }
      .step-title { font-size: 20px; font-weight: 700; fill: #183e61; }
      .step-copy { font-size: 14px; fill: #607489; }
    </style>
  </defs>
  <rect width="1365" height="720" fill="url(#bg)"/>
  <rect x="42" y="42" width="1281" height="636" rx="24" fill="#ffffff" stroke="#dce7f2" filter="url(#shadow)"/>

  <text x="86" y="112" class="sans h1">桩基工序照片完整性初筛工具</text>
  <text x="86" y="151" class="sans sub">把多层照片文件夹，转化为可筛选、可复核的“桩号 × 工序”Excel 矩阵</text>

  <g class="sans badge">
    <rect x="910" y="82" width="116" height="34" rx="17" fill="#e8f1fb"/><text x="968" y="104" text-anchor="middle">真实业务问题</text>
    <rect x="1036" y="82" width="116" height="34" rx="17" fill="#e8f1fb"/><text x="1094" y="104" text-anchor="middle">合成公开数据</text>
    <rect x="1162" y="82" width="116" height="34" rx="17" fill="#e8f1fb"/><text x="1220" y="104" text-anchor="middle">规则设计</text>
  </g>

  <g class="sans">
    <rect x="86" y="190" width="385" height="94" rx="17" fill="#fafcff" stroke="#dbe6f0"/>
    <text x="109" y="231" class="metric">约 1500 张</text><text x="109" y="260" class="caption">原项目一次批量统计的照片规模</text>
    <rect x="490" y="190" width="385" height="94" rx="17" fill="#fafcff" stroke="#dbe6f0"/>
    <text x="513" y="231" class="metric">130+ 桩号</text><text x="513" y="260" class="caption">整理后的阶段性核查范围</text>
    <rect x="894" y="190" width="384" height="94" rx="17" fill="#fafcff" stroke="#dbe6f0"/>
    <text x="917" y="231" class="metric">7 类工序</text><text x="917" y="260" class="caption">对中、焊接、验收、初灌等标准项</text>
  </g>

  <text x="86" y="328" class="sans" font-size="16" font-weight="700" fill="#31475f">核心流程</text>
  <g class="sans">
    <g transform="translate(86 350)">
      <rect width="257" height="158" rx="18" fill="#f5f9fd" stroke="#d9e6f1"/><rect x="19" y="19" width="31" height="31" rx="10" fill="#2f75b5"/>
      <text x="34.5" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text><text x="19" y="82" class="step-title">批量扫描</text>
      <text x="19" y="112" class="step-copy">读取日期 / 桩号文件夹下的</text><text x="19" y="135" class="step-copy">常见图片文件。</text>
    </g>
    <text x="365" y="438" font-size="28" fill="#7e9fba">→</text>
    <g transform="translate(403 350)">
      <rect width="257" height="158" rx="18" fill="#f5f9fd" stroke="#d9e6f1"/><rect x="19" y="19" width="31" height="31" rx="10" fill="#2f75b5"/>
      <text x="34.5" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text><text x="19" y="82" class="step-title">规则解析</text>
      <text x="19" y="112" class="step-copy">拆分桩号与工序，统一别名</text><text x="19" y="135" class="step-copy">和带编号变体。</text>
    </g>
    <text x="682" y="438" font-size="28" fill="#7e9fba">→</text>
    <g transform="translate(720 350)">
      <rect width="257" height="158" rx="18" fill="#f5f9fd" stroke="#d9e6f1"/><rect x="19" y="19" width="31" height="31" rx="10" fill="#2f75b5"/>
      <text x="34.5" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text><text x="19" y="82" class="step-title">合并归类</text>
      <text x="19" y="112" class="step-copy">合并 D 后缀桩号，异常命名</text><text x="19" y="135" class="step-copy">单独暴露。</text>
    </g>
    <text x="999" y="438" font-size="28" fill="#7e9fba">→</text>
    <g transform="translate(1037 350)">
      <rect width="241" height="158" rx="18" fill="#f5f9fd" stroke="#d9e6f1"/><rect x="19" y="19" width="31" height="31" rx="10" fill="#2f75b5"/>
      <text x="34.5" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text><text x="19" y="82" class="step-title">生成矩阵</text>
      <text x="19" y="112" class="step-copy">以 ✓ / ✗ 展示已检索到与</text><text x="19" y="135" class="step-copy">待人工复核项。</text>
    </g>
  </g>

  <rect x="86" y="544" width="1192" height="66" rx="10" fill="#fff7ec"/><rect x="86" y="544" width="5" height="66" rx="2.5" fill="#ef9b43"/>
  <text x="108" y="584" class="sans" font-size="15" fill="#74512b">边界：工具仅核对“是否检索到符合命名规则的照片”，不识别画面内容，不判断施工质量或验收结论。</text>
</svg>
